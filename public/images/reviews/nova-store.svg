<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgNova" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e0407" />
      <stop offset="50%" stop-color="#100305" />
      <stop offset="100%" stop-color="#050102" />
    </radialGradient>
    <linearGradient id="glowRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8241a" />
      <stop offset="100%" stop-color="#ff4a3f" />
    </linearGradient>
    <filter id="novaBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bgNova)" />
  <circle cx="400" cy="380" r="220" fill="#e8241a" opacity="0.14" filter="url(#novaBlur)" />
  <!-- Minimalist luxury streetwear/commerce mark -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none">
    <polygon points="400,160 580,320 580,560 400,640 220,560 220,320" />
    <polygon points="400,220 520,340 520,510 400,570 280,510 280,340" stroke="#e8241a" stroke-width="2" />
  </g>
  <circle cx="400" cy="390" r="50" fill="none" stroke="#ffffff" stroke-width="3" />
  <path d="M375,390 L425,390 M400,365 L400,415" stroke="#e8241a" stroke-width="3" stroke-linecap="square" />
  <text x="400" y="690" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="9" fill="#ffffff">NOVA STORE</text>
  <text x="400" y="728" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="5" fill="#e8241a">GLOBAL DIGITAL COMMERCE</text>
</svg>
