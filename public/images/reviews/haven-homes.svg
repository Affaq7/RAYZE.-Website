<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgHaven" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#24070a" />
      <stop offset="50%" stop-color="#120406" />
      <stop offset="100%" stop-color="#070203" />
    </radialGradient>
    <linearGradient id="redAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8241a" />
      <stop offset="100%" stop-color="#7a0a06" />
    </linearGradient>
    <filter id="havenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </feGaussianBlur>
  </defs>
  <rect width="800" height="800" fill="url(#bgHaven)" />
  <circle cx="400" cy="380" r="240" fill="#e8241a" opacity="0.12" filter="url(#havenGlow)" />
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none">
    <circle cx="400" cy="400" r="320" />
    <circle cx="400" cy="400" r="220" />
    <line x1="80" y1="400" x2="720" y2="400" />
    <line x1="400" y1="80" x2="400" y2="720" />
  </g>
  <!-- Architectural silhouette structure -->
  <g transform="translate(240, 260)">
    <polygon points="160,20 320,130 0,130" fill="none" stroke="#e8241a" stroke-width="3" />
    <rect x="50" y="130" width="220" height="150" fill="#141414" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
    <line x1="50" y1="210" x2="270" y2="210" stroke="#e8241a" stroke-width="1.5" stroke-dasharray="6 4" />
    <rect x="130" y="190" width="60" height="90" fill="#e8241a" opacity="0.85" />
    <line x1="90" y1="150" x2="110" y2="150" stroke="#fff" stroke-width="2" />
    <line x1="210" y1="150" x2="230" y2="150" stroke="#fff" stroke-width="2" />
  </g>
  <text x="400" y="580" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="8" fill="#ffffff">HAVEN HOMES</text>
  <text x="400" y="618" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="4" fill="#e8241a">ARCHITECTURAL RESIDENCES</text>
  <text x="400" y="648" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="11" letter-spacing="3" fill="rgba(255,255,255,0.4)">RAYZE IDENTITY &amp; MEDIA 2026</text>
